# Nginx Configuration - Future Production Use
#
# This configuration is for future production deployment with Nginx as reverse proxy.
# It is not currently used in the development Docker Compose setup.
#
# The configuration expects:
# - FastAPI backend service named "api" on port 8000
# - Frontend static build mounted at /usr/share/nginx/html
#
# This will be integrated into production Docker Compose when deployment is prepared.

server {
    listen 80;
    location /api/v1/ {
        proxy_pass http://api:8000;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
