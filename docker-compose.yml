version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: cubiland-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cubiland-network

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: cubiland-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cubiland-network

  # RabbitMQ message broker for Celery
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: cubiland-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cubiland-network
    # Management interface exposed only in development
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

  # FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cubiland-api
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: ${DATABASE_URL}
      # Redis
      REDIS_URL: ${REDIS_URL}
      # RabbitMQ/Celery
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_TASK_DEFAULT_QUEUE: ${CELERY_TASK_DEFAULT_QUEUE:-cubiland}
      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      # Resend
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      # Frontend
      FRONTEND_URL: ${FRONTEND_URL}
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cubiland-network

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cubiland-celery-worker
    restart: unless-stopped
    command: celery -A src.infrastructure.celery.app worker --loglevel=info --queues=${CELERY_TASK_DEFAULT_QUEUE:-cubiland}
    environment:
      # Database
      DATABASE_URL: ${DATABASE_URL}
      # Redis
      REDIS_URL: ${REDIS_URL}
      # RabbitMQ/Celery
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_TASK_DEFAULT_QUEUE: ${CELERY_TASK_DEFAULT_QUEUE:-cubiland}
      # Resend
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      # Frontend
      FRONTEND_URL: ${FRONTEND_URL}
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cubiland-network

  # Celery Beat (for scheduled tasks)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cubiland-celery-beat
    restart: unless-stopped
    command: celery -A src.infrastructure.celery.app beat --loglevel=info --scheduler celery.beat.PersistentScheduler
    environment:
      # Database
      DATABASE_URL: ${DATABASE_URL}
      # RabbitMQ/Celery
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_TASK_DEFAULT_QUEUE: ${CELERY_TASK_DEFAULT_QUEUE:-cubiland}
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - celery_beat_data:/celery
    networks:
      - cubiland-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: cubiland-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - cubiland-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  celery_beat_data:

networks:
  cubiland-network:
    driver: bridge
