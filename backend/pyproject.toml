[project]
name = "cubiland-backend"
version = "0.1.0"
description = "Cubiland Backend API"
authors = [
    { name = "Andrii Severyn" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.133.0,<0.166.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "sqlalchemy[asyncio] (>=2.0.0,<3.0.0)",
    "alembic>=1.13.0,<2.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "asyncpg>=0.32.0,<0.33.0",
    "celery>=5.4.0,<6.0.0",
    "redis>=5.0.0,<6.0.0",
    "structlog>=24.4.0,<26.0.0",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0,<0.27.0",
    "pytest>=8.3.2,<9.0.0",
    "httpx2 (>=2.16.2,<3.0.0)",
    "ruff (>=0.15,<1.0)",
    "mypy (>=1.19,<2.0)",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
check_untyped_defs = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers", "--tb=short"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
